# **Tidyverse**

- **Tidyverse** , gde _Tidy_ znači "uredno", a _verse_ označava "univerzum".  

- Kolekcija R paketa 📦, razvijenih od strane **H. Wickhama** i drugih u **RStudio** timu.

&lt;img src="assets/img/wickham_president.jpg" width="50%" style="display: block; margin: auto;" /&gt;


---

# **Tidyverse**

* " **Tidyverse** je okruženje (set paketa) za upravljanje podacima koji ima za cilj da olakša korake čišćenja i pripreme podataka" (Julien Barnier).

* Glavne karakteristike **uređenog (tidy) dataset-a**:
    - Svaka promenljiva je **kolona**  
    - Svako opažanje je **red**  
    - Svaka vrednost je u **posebnoj ćeliji**  


&lt;img src="assets/img/tidydata.png" width="80%" style="display: block; margin: auto;" /&gt;


---

# **Tidyverse** je kolekcija R paketa 📦

* `ggplot2` - vizualizacija podataka  
* `dplyr`, `tidyr` - manipulacija podacima  
* `purrr` - napredna programiranja  
* `readr` - uvoz podataka  
* `tibble` - poboljšani format `data.frame`  
* `forcats` - rad sa faktorima  
* `stringr` - rad sa tekstualnim podacima

# [Korišćenje Twitter-a za predikciju citiranosti ekoloških istraživanja](https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0166570)

# Rad 

Rad *"Using Twitter to predict citation rates of ecological research"* ispituje uticaj aktivnosti na Twitter-u na broj citata naučnih radova iz ekologije. Autori analiziraju da li broj tvitova o nekom radu može predvideti koliko će puta taj rad biti citiran u akademskoj literaturi.

🔹 Ključni nalazi:

- ✅ Postoji pozitivna korelacija između broja tvitova i broja citata, ali nije savršena.
- ✅ Tvitovanje može povećati vidljivost rada, ali nije glavni faktor u akademskom citiranju.
- ✅ Radovi iz poznatijih časopisa i oni sa većim impact faktorom imaju veći broj citata nezavisno od Twitter aktivnosti.

# Promena imena kolona 


``` r
citations_temp &lt;- rename(citations_raw,
       journal = 'Journal identity',
       impactfactor = '5-year journal impact factor',
       pubyear = 'Year published',
       colldate = 'Collection date',
       pubdate = 'Publication date',
       nbtweets = 'Number of tweets',
       woscitations = 'Number of Web of Science citations')
citations_temp
```

Naprvati novi objekat `citations_temp` sa novim imenima kolona 

`citations_temp` – novi dataset u kojem su neke kolone preimenovane 

- 'Journal identity' → journal
- '5-year journal impact factor' → impactfactor
- 'Year published' → pubyear
- 'Collection date' → colldate
- 'Publication date' → pubdate
- 'Number of tweets' → nbtweets
- 'Number of Web of Science citations' → woscitations

# Kreiranje (ili izmena) kolona


``` r
citations &lt;- mutate(citations_temp, journal = as.factor(journal))
citations
```

- 1️⃣ citations_temp –tabela ( tibble ili data.frame).
- 2️⃣ mutate() – funkcija koja omogućava dodavanje ili modifikaciju postojećih kolona.
- 3️⃣ journal = as.factor(journal) – kolona journal se konvertuje iz teksta (character) u faktor (factor).
- 4️⃣ citations – nova tabela  u kojoj je journal sada faktorska promenljiva.

# Lepši kod uz "pipe" operator `|&gt;` ranije (`%&gt;%`)


``` r
citations_raw |&gt;
  rename(journal = 'Journal identity',
       impactfactor = '5-year journal impact factor',
       pubyear = 'Year published',
       colldate = 'Collection date',
       pubdate = 'Publication date',
       nbtweets = 'Number of tweets',
       woscitations = 'Number of Web of Science citations') |&gt;
  mutate(journal = as.factor(journal))
```

- ✅ **Korak 1:** Početni dataset `citations_raw` ulazi u `rename()`.  
- ✅ **Korak 2:** `rename()` menja nazive kolona i prosleđuje rezultat dalje.  
- ✅ **Korak 3:** `mutate()` konvertuje kolonu `journal` u faktor.  
- ✅ **Konačan rezultat:** Dataset se prikazuje u konzoli bez čuvanja u novoj promenljivoj.

# Koja tabela je najbolja?

Sve ove tabele predstavljaju iste osnovne podatke, ali nisu podjednako jednostavne za korišćenje.  
Jedna od njih, `table1`, je lakša za rad unutar **Tidyverse-a**, jer je uređena (*tidy*).

Postoje tri međusobno povezana pravila koja dataset čine **uređenim (tidy)**:

- **Svaka promenljiva je kolona** – svaka kolona predstavlja jednu promenljivu.  
- **Svaka opservacija je red** – svaki red predstavlja jednu opservaciju.  
- **Svaka vrednost je ćelija** – svaka ćelija sadrži samo jednu vrednost.  


``` r
table1
#&gt; # A tibble: 6 × 4
#&gt;   country      year  cases population
#&gt;   &lt;chr&gt;       &lt;dbl&gt;  &lt;dbl&gt;      &lt;dbl&gt;
#&gt; 1 Afghanistan  1999    745   19987071
#&gt; 2 Afghanistan  2000   2666   20595360
#&gt; 3 Brazil       1999  37737  172006362

## Transformacija u long format

Podaci u **širokom formatu** često nisu pogodni za analizu. Funkcija **`pivot_longer()`** omogućava transformaciju u **dugi format**, gde se **više kolona objedini u dve kolone** – **naziv kategorije i njena vrednost**.


``` r
# Pretvaranje širokog formata u dugi format
df_long &lt;- df_wide |&gt;  # Početni dataset `df_wide` se prosleđuje sledećoj funkciji
  pivot_longer(
    cols = starts_with("plata"),  # Odabir kolona koje treba pretvoriti u dugi format (sve koje počinju sa "plata")
    names_to = "godina",          # Nazivi originalnih kolona (npr. "plata_2022") se smeštaju u novu kolonu "godina"
    values_to = "iznos"           # Vrednosti iz originalnih kolona se smeštaju u novu kolonu "iznos"
  )

df_long
```

```
## # A tibble: 6 × 3
##   ime    godina     iznos
##   &lt;chr&gt;  &lt;chr&gt;      &lt;dbl&gt;

## 3 Marko  plata_2022 70000
## 4 Marko  plata_2023 73000
## 5 Jovana plata_2022 50000
## 6 Jovana plata_2023 52000
```

# Vizualizacija sa ggplot2

* Paket **ggplot2** implementira **g**ramatiku **g**rafike (*Grammar of Graphics*).  

* Radi sa `data.frame` ili `tibble` objektima, ali ne direktno sa vektorima kao **base R**.  

* Jasno razdvaja **podatke** od **načina na koji su prikazani**.  

&lt;img src="assets/img/ggplot2_logo.jpg" width="30%" style="display: block; margin: auto;" /&gt;

---

# Gramatika ggplot2


 Element grafike   | Opis
 :---------------- | :-----------------------------
 **Podaci (Data)** | `data.frame` koji se prikazuje na grafiku
 **Geometrija (Geometrics)** | Geometrijski oblik koji predstavlja podatke
                   | (npr. tačke, boxplot, histogram)
 **Estetika (Aesthetics)** | Vizuelne karakteristike geometrijskog objekta
                   | (npr. boja, veličina, oblik)



&lt;img src="assets/img/ggplot2_logo.jpg" width="30%" style="display: block; margin: auto;" /&gt;
